# Cloudflare Pages configuration — https://developers.cloudflare.com/pages/configuration/
#
# Note: Cloudflare Pages serves single-page apps by default when no top-level
# 404.html exists, so a catch-all rewrite is NOT declared here (it would
# shadow real files). Add a `_redirects` file with
#   /*  /index.html  200
# only if 404.html ever gets introduced.

[build]
  command = "npm run build"
  destination = "dist"

[build.environment]
  NODE_VERSION = "22"

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
