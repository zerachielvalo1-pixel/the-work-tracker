# Netlify configuration — https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Everything here is about the two things that decide whether a phone feels
# fast on this app: (1) never re-downloading unchanged assets, and
# (2) not paying TLS + connection setup on every third-party host.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Uncomment if the package manager is pnpm instead of npm:
  # NPM_FLAGS = "--version"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# SPA fallback: the app renders from client state today, but this keeps deep
# links working the moment routing is added. Static files still win because
# Netlify resolves real files before applying a catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Vite fingerprints these filenames, so they can never go stale.
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    # The HTML is what points at the current asset hashes: always revalidate.
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # Preconnect is set once, at the document level, for the Supabase origin.
    # See README ("Supabase preconnect") for the exact value to use.
