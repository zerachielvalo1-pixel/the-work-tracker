<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>verify ·? board</title>
    <link rel="stylesheet" href="/assets/index-UbbOLeBf.css" />
  </head>
  <body>
    <div class="shell">
      <header class="shell__bar">
        <button type="button" class="shell__menu" aria-label="Open navigation">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>
        <span class="brand shell__brand"><span class="brand__the">the</span><span class="brand__work">WORK</span></span>
      </header>
      <div class="shell__scrim"></div>
      <aside class="shell__sidebar">
        <div class="shell__sidebar-head">
          <span class="brand" style="font-size:20px"><span class="brand__the">the</span><span class="brand__work">WORK</span></span>
          <button type="button" class="shell__close" aria-label="Close navigation">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <nav class="shell__nav" aria-label="Main">
          <div class="shell__group">
            <div class="shell__label">Workspace</div>
            <div role="group">
              <button type="button">Overview</button>
              <button type="button" class="is-active">Board</button>
              <button type="button">List</button>
              <button type="button">Calendar</button>
            </div>
          </div>
          <div class="shell__group">
            <div class="shell__label">Editorial</div>
            <div role="group">
              <button type="button">Pitch box</button>
              <button type="button">New task</button>
            </div>
          </div>
          <div class="shell__group">
            <div class="shell__label">Planned</div>
            <div role="group">
              <button type="button" class="is-planned">Issues <span class="shell__soon">soon</span></button>
              <button type="button" class="is-planned">Team <span class="shell__soon">soon</span></button>
            </div>
          </div>
        </nav>
        <div class="shell__sidebar-foot">
          <button type="button" class="shell__signout">Settings</button>
          <button type="button" class="shell__signout">Sign out</button>
        </div>
      </aside>

      <main class="shell__main">
        <div>
          <div class="page__head">
            <h1 class="page__title">Board</h1>
            <p class="page__sub">Every task by stage of the workflow. Tap a card for details, or use Next to advance it.</p>
          </div>

          <div class="board">
            <section class="board__col">
              <h2 class="board__head"><span>Pitched</span><span class="board__count">2</span></h2>
              <article class="tcard">
                <button type="button" class="tcard__main">
                  <span class="tcard__title">The quiet rise of night-shift bakeries</span>
                  <span class="tcard__meta">article · <span class="is-overdue">Oct 4</span></span>
                </button>
                <div class="tcard__foot">
                  <span class="badge" style="background:#FFF4E5;color:#9A5B00">high</span>
                  <button type="button" class="tcard__next">Next: Assigned</button>
                </div>
              </article>
              <article class="tcard">
                <button type="button" class="tcard__main">
                  <span class="tcard__title">Letters: what the harbour means now</span>
                  <span class="tcard__meta">folio piece</span>
                </button>
                <div class="tcard__foot">
                  <span class="badge" style="background:#F2EDFB;color:#3D2E5C">normal</span>
                  <button type="button" class="tcard__next">Next: Assigned</button>
                </div>
              </article>
            </section>

            <section class="board__col">
              <h2 class="board__head"><span>In progress</span><span class="board__count">1</span></h2>
              <article class="tcard">
                <button type="button" class="tcard__main">
                  <span class="tcard__title">Photos: harbour at first light</span>
                  <span class="tcard__meta">photo · Oct 6</span>
                </button>
                <div class="tcard__foot">
                  <span class="badge" style="background:#F2EDFB;color:#3D2E5C">normal</span>
                  <button type="button" class="tcard__next">Next: In review</button>
                </div>
              </article>
            </section>

            <section class="board__col">
              <h2 class="board__head"><span>Copyread</span><span class="board__count">0</span></h2>
              <p class="board__empty">Nothing here</p>
            </section>

            <section class="board__col">
              <h2 class="board__head"><span>Done</span><span class="board__count">1</span></h2>
              <article class="tcard">
                <button type="button" class="tcard__main">
                  <span class="tcard__title">Editor's note: three years in</span>
                  <span class="tcard__meta">article · Sep 28</span>
                </button>
              </article>
            </section>
          </div>

          <div class="board__killed">
            <button type="button" class="disclosure"><span class="disclosure__caret">·?</span>Killed (1)</button>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
