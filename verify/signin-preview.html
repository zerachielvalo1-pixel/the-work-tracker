<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>verify — sign in</title>
    <link rel="stylesheet" href="/assets/index-C-wF8Ngt.css" />
  </head>
  <body>
    <div class="signin">
      <form class="signin__card">
        <div class="signin__head">
          <div class="brand signin__brand"><span class="brand__the">the</span><span class="brand__work">WORK</span></div>
          <h1 class="signin__title">Editor Sign In</h1>
          <p class="signin__sub">Sign in to manage The Work.</p>
        </div>

        <div class="alert" role="alert">Invalid login credentials</div>

        <div class="form-field">
          <label class="form-label" for="signin-email">Email</label>
          <input id="signin-email" class="input" type="email" value="editor@thework.com" />
        </div>

        <div class="form-field" style="margin-bottom: 20px">
          <label class="form-label" for="signin-password">Password</label>
          <input id="signin-password" class="input" type="password" value="secret" />
        </div>

        <button type="submit" class="btn btn--primary" style="width: 100%">Sign In</button>
      </form>
    </div>
  </body>
</html>
